<main><header class="heading"><div class="heading-left"><h1>缓存续期</h1><span class="running"><i class="status-dot"></i>自动运行</span></div><button class="button" id="reload" aria-label="刷新状态"><svg><use href="#refresh"/></svg>刷新</button></header>

<div class="bottom"><svg><use href="#check"/></svg><span>选择已保存</span><button class="help" data-tip="正式插件在服务器保存选择并运行计时。浏览器关闭后仍会继续。" aria-label="保存与运行说明">?</button></div></main></div><div class="toast" role="status" hidden></div>
<dialog id="auth"><form method="dialog"><h2>连接管理接口</h2><label for="management-key">CPA Management Key</label><input id="management-key" type="password" autocomplete="off" placeholder="输入管理密钥"><div style="display:flex;gap:12px;margin-top:20px"><button id="connect" type="button" class="button">连接</button><button class="button">取消</button><button type="button" class="help" aria-label="管理认证说明" data-tip="密钥仅保存在本页内存中，用于请求 CPA 的认证管理接口。OMC 中可直接使用已登录会话，无需重复输入。">?</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const initial={items:[],now:Date.now(),capacity:16,interval:50,paused:false,pauseReason:'',version:'0.11.0'};
let managementKey='',authBlocked=false;
const hostedPrefix=location.pathname.includes('/api/v1/plugin-host/')?location.pathname.split('/api/v1/plugin-host/')[0]+'/api/v1/plugin-host':'';
const managementBase=hostedPrefix+'/v0/management/plugins/claude-cache-keepalive';
let items=initial.items,filter='all',highlight=null,serverOffset=initial.now-Date.now(),refreshing=false;
const currentTime=()=>Date.now()+serverOffset;
const cfg=initial;
const clock=t=>new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'});
const remaining=t=>{let sec=Math.max(0,Math.ceil((t-currentTime())/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`};
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function themeUI(){const dark=document.documentElement.dataset.theme==='dark';$('#theme-label').textContent=dark?'深色':'浅色';$('#theme-icon').setAttribute('href',dark?'#sun':'#moon');$('#theme').setAttribute('aria-label',dark?'切换为浅色':'切换为深色')}
$('#theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('cache-keep-theme',next)}catch(e){}themeUI()};themeUI();
function toast(text){$('.toast').textContent=text;$('.toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('.toast').hidden=true,2400)}
function render(){
 $('#capacity').textContent=cfg.capacity;$('#interval').textContent=cfg.interval;$('.running').innerHTML='<i class="status-dot"></i>'+(cfg.paused?'续期暂停':'自动运行');$('.running').title=cfg.pauseReason||''; const active=items.filter(x=>x.active),attention=items.filter(x=>x.ttl!=='1h'||x.error||x.paused);$('#active-count').textContent=active.length;$('#filter-active').textContent=active.length;$('#total-count').textContent=items.length;$('#all-count').textContent=items.length;$('#attention-count').textContent=attention.length;
 $('.capacity-bars').innerHTML=Array.from({length:cfg.capacity},(_,i)=>`<i class="${i<items.length?'filled':''}"></i>`).join('');
 const list=items.filter(x=>filter==='all'||(filter==='active'?x.active:(x.ttl!=='1h'||x.error||x.paused)));
 $('#rows').innerHTML=list.map(x=>`<article class="row ${highlight===x.id?'highlight':''}" data-id="${x.id}"><div class="conversation"><span class="avatar">${icon('chat')}</span><div style="min-width:0"><div class="name">${escapeHTML(x.name)}</div><div class="model">${escapeHTML(x.model)} <button class="help" aria-label="会话识别与缓存详情" data-tip="${escapeHTML(x.detail)}">?</button></div></div></div><div class="cache"><span class="badge ${(x.ttl==='5m'||x.ttl==='mixed')?'warn':x.ttl==='unknown'?'unknown':''}">${x.ttl==='5m'?icon('warning'):''}${x.ttl==='unknown'?'未知':x.ttl==='mixed'?'混合':x.ttl}</span> ${x.ttl!=='1h'?`<button class="help" aria-label="${x.ttl==='5m'?'五分钟缓存提示':'缓存时长说明'}" data-tip="${x.ttl==='5m'?'请求声明五分钟缓存，当前续期间隔无法覆盖。':x.ttl==='mixed'?'请求混用 1h 和 5m，50 分钟只能覆盖 1h 部分。':'当前请求没有可识别的缓存时长标记。'}">?</button>`:''}</div><div class="last time"><span class="mobile-label">最近请求</span>${clock(x.last)}</div><div class="renew">${x.active&&!x.paused&&!cfg.paused?`<span class="renew-time" data-timer="${x.id}">${remaining(x.next)}</span><div class="progress"><i data-progress="${x.id}" style="width:${Math.max(0,Math.min(100,(x.next-currentTime())/(cfg.interval*600)))}%"></i></div>`:x.ttl==='5m'?`<span class="renew-note">需改为 1h</span>`:`<span class="idle">${x.paused||cfg.paused?'已暂停':x.ttl==='unknown'?'待识别':'未开启'}</span>`}</div><div class="actions"><button class="toggle" role="switch" aria-checked="${x.active}" aria-label="${x.active?'暂停':'开启'} ${escapeHTML(x.name)} 的保活" data-toggle="${x.id}"></button><div class="action-wrap"><button class="more" aria-label="${escapeHTML(x.name)} 更多操作" aria-expanded="false" data-menu="${x.id}">${icon('dots')}</button><div class="menu" hidden><button data-ping="${x.id}">立即续期</button><button data-rename="${x.id}">重命名</button></div></div></div></article>`).join('')||'<div class="empty">这里还没有对话</div>';
 updateClock()
}
function updateClock(){const active=items.filter(x=>x.active&&!x.paused&&!cfg.paused);if(active.length){const earliest=Math.min(...active.map(x=>x.next));$('.orbit').style.setProperty('--fill',Math.max(0,Math.min(100,(earliest-currentTime())/30000))+'%');$('#next-clock').textContent=clock(earliest);$('#next-caption').textContent=`还有 ${remaining(earliest)}`}else{$('#next-clock').textContent='—';$('#next-caption').textContent='暂无续期计划'}items.forEach(x=>{const timer=document.querySelector(`[data-timer="${x.id}"]`),bar=document.querySelector(`[data-progress="${x.id}"]`);if(timer)timer.textContent=remaining(x.next);if(bar)bar.style.width=Math.max(0,Math.min(100,(x.next-currentTime())/(cfg.interval*600)))+'%'})}
async function refresh(params){
 if(refreshing)return;refreshing=true;
 try{
  const headers={};if(managementKey)headers.Authorization='Bearer '+managementKey;
  let payload=null;if(params){
   if(params.toggle)payload={action:'toggle',id:params.toggle,enabled:params.on==='1'};
   if(params.ping)payload={action:'ping',id:params.ping};
   if(params.rename)payload={action:'rename',id:params.rename,name:params.name};
   if(params.forget)payload={action:'forget',id:params.forget};
   headers['Content-Type']='application/json';
  }
  const r=await fetch(managementBase+(payload?'/actions':'/state'),{method:payload?'POST':'GET',headers,body:payload?JSON.stringify(payload):undefined,cache:'no-store',credentials:'same-origin'});
  if(r.status===401||r.status===403){authBlocked=true;$('#auth').showModal();return}
  if(!r.ok){const failure=await r.json().catch(()=>({}));throw Error(failure.error||('HTTP '+r.status))}
  const data=await r.json();if(!Array.isArray(data.items))throw Error('状态响应无效');
  items=data.items;Object.assign(cfg,data);serverOffset=data.now-Date.now();render();
  if(data.actionError)toast(data.actionError);else if(params)toast('已保存');
 }catch(e){toast('更新失败：'+e.message)}finally{refreshing=false}
}
$('#reload').onclick=()=>refresh();
document.addEventListener('click',e=>{
 const help=e.target.closest('.help');if(help){help.classList.toggle('open');return}
 document.querySelectorAll('.help.open').forEach(x=>x.classList.remove('open'));
 const tab=e.target.closest('[data-filter]');if(tab){filter=tab.dataset.filter;document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('active',x===tab);x.setAttribute('aria-selected',String(x===tab))});render()}
 const toggle=e.target.closest('[data-toggle]');if(toggle){const x=items.find(x=>x.id===toggle.dataset.toggle);refresh({toggle:x.id,on:x.active?'0':'1'})}
 const menu=e.target.closest('[data-menu]');document.querySelectorAll('.menu').forEach(x=>{if(!menu||x!==menu.nextElementSibling)x.hidden=true});if(menu){menu.nextElementSibling.hidden=!menu.nextElementSibling.hidden;menu.setAttribute('aria-expanded',String(!menu.nextElementSibling.hidden))}
 const ping=e.target.closest('[data-ping]');if(ping)refresh({ping:ping.dataset.ping});
 const rename=e.target.closest('[data-rename]');if(rename){const x=items.find(x=>x.id===rename.dataset.rename);const name=prompt('对话名称',x.name);if(name!==null)refresh({rename:x.id,name:name.trim().slice(0,42)})}
});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.menu').forEach(x=>x.hidden=true);document.querySelectorAll('.help.open').forEach(x=>x.classList.remove('open'))}});
$('#version').textContent=cfg.version;
$('#connect').onclick=()=>{authBlocked=false;managementKey=$('#management-key').value;$('#management-key').value='';$('#auth').close();refresh()};
$('#management-key').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#connect').click()}};
render();refresh();setInterval(updateClock,1000);
setInterval(()=>{if(!document.hidden&&!authBlocked&&!$('#auth').open&&!document.querySelector('.menu:not([hidden])'))refresh()},15000);

</script></body></html>
